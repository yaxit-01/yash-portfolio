<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#1683F7"/>
      <stop offset="1" stop-color="#1557D6"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#030507"/>

  <!-- Y -->
  <g filter="url(#glow)" fill="url(#blue)">
    <path d="M170 190 H305 L500 415 L695 190 H830 L565 505 V700 H430 V505 Z"/>
    <path d="M385 700 L385 570 L555 390 L555 530 L500 585 L500 700 Z"/>
  </g>

  <!-- D -->
  <path d="M600 190 H710 C810 190 875 265 875 365 V525 C875 625 810 700 710 700 H600 V585 H690 C730 585 755 560 755 520 V370 C755 330 730 305 690 305 H600 Z"
        fill="url(#silver)"/>

  <!-- Name -->
  <text x="500" y="815" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700"
        letter-spacing="10" fill="#FFFFFF">YASH <tspan fill="#1683F7">DIXIT</tspan></text>

  <!-- Portfolio -->
  <line x1="170" y1="875" x2="335" y2="875" stroke="#1683F7" stroke-width="3"/>
  <line x1="665" y1="875" x2="830" y2="875" stroke="#1683F7" stroke-width="3"/>
  <text x="500" y="892" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="30"
        letter-spacing="18" fill="#F8FAFC">PORTFOLIO</text>
</svg>